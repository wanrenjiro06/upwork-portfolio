<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday — POS Customer Display Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:      #3FA7E0;
    --blue-deep: #1E63B0;
    --blue-lite: #82D2FF;
    --indigo:    #5A6BD8;
    --ink:       #060912;
    --text:      #F4F6FF;
    --text-dim:  #9AA8CF;
    --flame:     #FFD45E;
    --font-head: 'Fredoka', system-ui, sans-serif;
    --font-body: 'Outfit', system-ui, sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage { position: fixed; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #16224d 0%, #0c1330 44%, #060912 100%); }

  #scene { position: absolute; inset: 0; display: block; }

  /* ambient blurred glow orbs — translate-only drift (perf) */
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .42; pointer-events: none; will-change: transform; }
  .orb.a { width: 520px; height: 520px; background: #25559e; top: -160px; left: -120px; animation: drift1 20s ease-in-out infinite; }
  .orb.b { width: 460px; height: 460px; background: #4a3f9c; bottom: -180px; right: -120px; animation: drift2 24s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(46px,34px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-30px)} }

  /* ---- Headline ---- */
  #head { position: absolute; z-index: 4; top: clamp(20px, 7vh, 70px); left: 0; right: 0; text-align: center; padding: 0 24px; pointer-events: none; transition: opacity .45s ease; }
  .kicker {
    font-weight: 600; font-size: clamp(11px, 1.4vw, 15px); letter-spacing: .34em; text-transform: uppercase;
    color: var(--blue-lite); opacity: 0; transform: translateY(14px);
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1);
  }
  h1 {
    font-family: var(--font-head); font-weight: 700; font-size: clamp(34px, 7.4vw, 96px); line-height: .96;
    letter-spacing: -.01em; margin-top: 10px;
    background: linear-gradient(180deg, #ffffff 0%, var(--blue-lite) 58%, var(--blue) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 46px rgba(130,210,255,.22);
  }
  h1 .word { display: inline-block; margin-right: .22em; opacity: 0; transform: translateY(26px) scale(.9);
    /* gradient clip must live on the words themselves — background-clip:text on the
       parent h1 does not paint through inline-block descendant boxes */
    background: linear-gradient(180deg, #ffffff 0%, var(--blue-lite) 58%, var(--blue) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 .word.in { animation: wordIn .62s cubic-bezier(.2,1.2,.35,1) forwards; }
  @keyframes wordIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  #name {
    display: block; margin-top: 6px; font-family: var(--font-head); font-weight: 700;
    font-size: clamp(26px, 5.4vw, 70px); line-height: 1;
    background: linear-gradient(180deg, #FFE9A8 0%, var(--flame) 60%, #F2A03D 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(255,212,94,.25);
    opacity: 0; transform: translateY(20px) scale(.92);
    transition: opacity .6s ease .35s, transform .7s cubic-bezier(.2,1.3,.4,1) .35s;
  }
  #head.in .kicker { opacity: .95; transform: translateY(0); }
  #head.in #name  { opacity: 1; transform: translateY(0) scale(1); }

  /* ---- Wish toast ---- */
  #wish { position: absolute; z-index: 5; left: 50%; top: clamp(20px, 7vh, 70px); transform: translate(-50%, -10px);
    text-align: center; opacity: 0; pointer-events: none; transition: opacity .5s ease, transform .6s cubic-bezier(.2,1.3,.4,1); }
  #wish.show { opacity: 1; transform: translate(-50%, 0); }
  #wish .big { font-family: var(--font-head); font-weight: 700; font-size: clamp(30px, 6.6vw, 84px); line-height: .98;
    background: linear-gradient(180deg, #ffffff, var(--blue-lite) 60%, var(--blue));
    -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 46px rgba(130,210,255,.28); }
  #wish .small { margin-top: 8px; color: var(--text-dim); font-size: clamp(13px,1.8vw,19px); font-weight: 500; }

  /* ---- Footer controls ---- */
  footer { position: absolute; z-index: 6; left: 0; right: 0; bottom: clamp(12px, 3vh, 30px);
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 0 18px; }
  .hint { display: flex; align-items: center; gap: 9px; color: var(--text-dim); font-size: 13.5px; letter-spacing: .02em; transition: opacity .4s ease; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-lite); box-shadow: 0 0 10px var(--blue-lite); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  .sep { width: 1px; height: 16px; background: rgba(255,255,255,.14); }
  .field { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 5px 6px 5px 13px; }
  .field input { width: 132px; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 14px; font-weight: 500; }
  .field input::placeholder { color: var(--text-dim); }
  .btn { font-family: var(--font-body); font-weight: 700; font-size: 14px; color: #07223f;
    background: linear-gradient(180deg, var(--blue-lite), var(--blue) 56%, var(--blue-deep));
    border: none; border-radius: 10px; padding: 9px 18px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(63,167,224,.32), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .12s ease, box-shadow .2s ease; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(63,167,224,.42), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn:active { transform: translateY(0) scale(.97); }
  .ghost { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: var(--text-dim);
    border-radius: 10px; padding: 8px 13px; font-size: 13px; font-family: var(--font-body); cursor: pointer; transition: all .18s ease; }
  .ghost:hover { color: var(--text); border-color: rgba(130,210,255,.4); }

  @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
</style>
</head>
<body>
  <div id="stage">
    <div class="orb a"></div>
    <div class="orb b"></div>

    <canvas id="scene"></canvas>

    <div id="head">
      <div class="kicker">From all of us at the shop</div>
      <h1 id="title"></h1>
      <span id="name">Friend</span>
    </div>

    <div id="wish">
      <div class="big">Make a wish! ✨</div>
      <div class="small">Wishing you the happiest of birthdays</div>
    </div>

    <footer>
      <div class="hint" id="hint"><span class="dot"></span> Tap the cake to blow out the candles</div>
      <div class="sep"></div>
      <div class="field">
        <input id="nameInput" type="text" placeholder="Customer name" maxlength="18" value="Sarah">
        <button class="btn" id="celebrateBtn">Celebrate</button>
      </div>
      <button class="ghost" id="muteBtn">🔊 Sound on</button>
    </footer>
  </div>

<script>
(() => {
  'use strict';

  // ============================================================
  //  Happy Birthday — POS customer-display celebration
  //  Self-contained: canvas-drawn cake/flames/balloons/confetti,
  //  procedurally-synthesized "Happy Birthday" melody (no assets).
  //
  //  PERFORMANCE MODEL (mirrors the Spin & Win pre-rendered face):
  //    Everything STATIC is rendered ONCE to an offscreen canvas —
  //    the cake (plate, tiers, frosting, candle bodies), balloon
  //    bodies, the sparkle glyph and the flame halo are all sprites.
  //    Each frame only blits sprites + draws the cheap live bits
  //    (flame beziers, confetti rects, motion) — no per-frame
  //    gradient allocation, no canvas shadowBlur. Holds 60fps on a
  //    low-end POS tablet.
  //
  //  PRODUCTION HOOK (mirrors spinTo):
  //    Birthday.start(customerName)   -> play the celebration
  //    Birthday.onComplete = () => {} -> fired after the finale
  // ============================================================

  const TWO_PI = Math.PI * 2;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let dpr = 1, cw = 0, ch = 0, U = 0;

  let cake = null;
  let cakeSprite = null;            // offscreen pre-rendered cake (static)
  const balloonSprites = {};        // colorKey -> offscreen canvas
  let sparkleSprite = null;
  let haloSprite = null;

  // ---------- Helpers ----------
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  function pseudo(x) { const s = Math.sin(x * 127.1) * 43758.5453; return s - Math.floor(s); }
  function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  // ============================================================
  //  Resize + layout
  // ============================================================
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth;
    ch = window.innerHeight;
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.min(cw, ch);
    layoutCake();
    buildSprites();
  }

  function layoutCake() {
    const w = U * 0.40;
    const tierH = U * 0.115;
    const plateY = ch * 0.80;
    const cx = cw / 2;
    cake = {
      cx, plateY,
      plateW: w * 1.5,
      tiers: [
        { w: w,        h: tierH, color: '#5A6BD8', frost: '#8C97EE' },
        { w: w * 0.66, h: tierH, color: '#3FA7E0', frost: '#82D2FF' },
      ],
      candleW: Math.max(7, U * 0.016),
      candleH: U * 0.105,
    };
    layoutCandles();
  }

  let candles = [];
  function layoutCandles() {
    candles = [];
    const top = cake.tiers[cake.tiers.length - 1];
    const n = 5;
    const topY = cake.plateY - cake.tiers[0].h - top.h;
    const spread = top.w * 0.72;
    for (let i = 0; i < n; i++) {
      const fx = (i / (n - 1) - 0.5);
      candles.push({
        x: cake.cx + fx * spread,
        baseY: topY,
        h: cake.candleH,
        color: ['#82D2FF', '#FFFFFF', '#5A6BD8', '#FFFFFF', '#82D2FF'][i % 5],
        lit: true, flame: 1, flick: Math.random() * TWO_PI, smoke: [],
      });
    }
  }

  // ============================================================
  //  Sprite builders (run once per resize)
  // ============================================================
  function buildSprites() {
    buildCakeSprite();
    buildBalloonSprites();
    buildSparkleSprite();
    buildHaloSprite();
  }

  function buildCakeSprite() {
    // Full-stage offscreen: lets us bake the soft plate shadow without
    // a per-frame canvas blur. Blitting one image/frame is GPU-cheap.
    cakeSprite = newCanvas(cw * dpr, ch * dpr);
    const c = cakeSprite.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { cx, plateY, plateW, tiers } = cake;

    // plate soft shadow (radial — no blur filter)
    const sh = c.createRadialGradient(cx, plateY + U * 0.02, 0, cx, plateY + U * 0.02, plateW * 0.6);
    sh.addColorStop(0, 'rgba(0,0,0,0.4)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = sh;
    c.fillRect(cx - plateW * 0.7, plateY - U * 0.04, plateW * 1.4, U * 0.14);

    // plate
    c.beginPath();
    c.ellipse(cx, plateY, plateW * 0.5, U * 0.026, 0, 0, TWO_PI);
    const pg = c.createLinearGradient(cx - plateW * 0.5, 0, cx + plateW * 0.5, 0);
    pg.addColorStop(0, '#cdd6f2'); pg.addColorStop(0.5, '#eef3ff'); pg.addColorStop(1, '#aab6da');
    c.fillStyle = pg; c.fill();

    // tiers (bottom up)
    let y = plateY;
    for (let i = 0; i < tiers.length; i++) {
      const t = tiers[i];
      const topY = y - t.h;
      drawTier(c, cx, y, topY, t);
      y = topY;
    }

    // candle bodies (static) — flames are drawn live on top
    for (const cd of candles) drawCandleBody(c, cd);
  }

  function drawTier(c, cx, baseY, topY, t) {
    const halfW = t.w * 0.5;
    const ry = U * 0.022;

    c.beginPath();
    c.moveTo(cx - halfW, topY);
    c.lineTo(cx - halfW, baseY);
    c.ellipse(cx, baseY, halfW, ry, 0, Math.PI, 0, true);
    c.lineTo(cx + halfW, topY);
    c.closePath();
    const bg = c.createLinearGradient(cx - halfW, 0, cx + halfW, 0);
    bg.addColorStop(0, shade(t.color, -26)); bg.addColorStop(0.5, t.color); bg.addColorStop(1, shade(t.color, -40));
    c.fillStyle = bg; c.fill();

    drawSprinkles(c, cx, topY + U * 0.03, halfW, baseY - topY - U * 0.05, t);

    // frosting cap
    c.beginPath();
    c.ellipse(cx, topY, halfW, ry, 0, 0, TWO_PI);
    const fg = c.createLinearGradient(0, topY - ry, 0, topY + ry);
    fg.addColorStop(0, '#ffffff'); fg.addColorStop(1, t.frost);
    c.fillStyle = fg; c.fill();

    // drip skirt
    c.beginPath();
    c.moveTo(cx - halfW, topY);
    const drips = 7;
    for (let d = 0; d <= drips; d++) {
      const dx = cx - halfW + (d / drips) * (halfW * 2);
      const depth = (Math.sin(d * 1.7) * 0.5 + 0.6) * U * 0.03;
      c.quadraticCurveTo(dx, topY + depth + ry * 0.4, dx + (halfW * 2 / drips) * 0.5, topY + ry * 0.2);
    }
    c.lineTo(cx + halfW, topY);
    c.ellipse(cx, topY, halfW, ry, 0, 0, Math.PI, false);
    c.closePath();
    c.fillStyle = t.frost; c.globalAlpha = 0.96; c.fill(); c.globalAlpha = 1;

    c.beginPath();
    c.ellipse(cx, topY, halfW, ry, 0, 0, TWO_PI);
    c.fillStyle = 'rgba(255,255,255,0.18)'; c.fill();
  }

  function drawSprinkles(c, cx, top, halfW, h, t) {
    const seed = (t.w * 13.0) % 97;
    const n = 26;
    for (let i = 0; i < n; i++) {
      const rx = (pseudo(seed + i * 1.7) - 0.5) * 2 * halfW * 0.86;
      const ry = pseudo(seed + i * 2.3) * h;
      c.save();
      c.translate(cx + rx, top + ry);
      c.rotate(pseudo(seed + i) * TWO_PI);
      c.fillStyle = ['#ffffff', '#FFD45E', '#FF9BCF', '#82D2FF'][i % 4];
      c.globalAlpha = 0.9;
      c.fillRect(-U * 0.004, -U * 0.0014, U * 0.008, U * 0.0028);
      c.restore();
    }
    c.globalAlpha = 1;
  }

  function drawCandleBody(c, cd) {
    const w = cake.candleW;
    const topY = cd.baseY - cd.h;
    c.save();
    roundRect(c, cd.x - w / 2, topY, w, cd.h, w * 0.25);
    c.clip();
    c.fillStyle = '#ffffff';
    c.fillRect(cd.x - w / 2, topY, w, cd.h);
    c.strokeStyle = cd.color;
    c.lineWidth = w * 0.5;
    for (let yy = -cd.h; yy < cd.h; yy += w * 1.1) {
      c.beginPath();
      c.moveTo(cd.x - w, topY + yy);
      c.lineTo(cd.x + w, topY + yy + w * 1.6);
      c.stroke();
    }
    c.restore();
    roundRect(c, cd.x - w / 2, topY, w, cd.h, w * 0.25);
    c.strokeStyle = 'rgba(0,0,0,0.12)'; c.lineWidth = 1; c.stroke();
    // wick
    c.beginPath();
    c.moveTo(cd.x, topY);
    c.lineTo(cd.x, topY - w * 0.6);
    c.strokeStyle = '#3a2a1a'; c.lineWidth = Math.max(1.4, w * 0.16); c.stroke();
  }

  const BR = 120;                              // balloon sprite base radius
  const BALLOON_COLORS = [
    ['#3FA7E0', '#82D2FF'], ['#5A6BD8', '#94A3FF'], ['#E8EEFF', '#FFFFFF'],
    ['#3FB6A8', '#74E7D9'], ['#F2A03D', '#FFC476'],
  ];
  function buildBalloonSprites() {
    for (let i = 0; i < BALLOON_COLORS.length; i++) {
      const [c0, c1] = BALLOON_COLORS[i];
      const cv = newCanvas(BR * 2, BR * 2.6);
      const c = cv.getContext('2d');
      const ox = BR, oy = BR * 1.02;           // body center inside sprite
      const g = c.createRadialGradient(ox - BR * 0.32, oy - BR * 0.42, BR * 0.1, ox, oy, BR * 1.25);
      g.addColorStop(0, c1); g.addColorStop(0.55, c0); g.addColorStop(1, shade(c0, -34));
      c.beginPath(); c.ellipse(ox, oy, BR * 0.86, BR, 0, 0, TWO_PI); c.fillStyle = g; c.fill();
      // knot
      c.beginPath();
      c.moveTo(ox - BR * 0.1, oy + BR * 0.98); c.lineTo(ox + BR * 0.1, oy + BR * 0.98); c.lineTo(ox, oy + BR * 1.14);
      c.closePath(); c.fillStyle = shade(c0, -34); c.fill();
      // highlight
      c.beginPath(); c.ellipse(ox - BR * 0.3, oy - BR * 0.36, BR * 0.2, BR * 0.32, -0.5, 0, TWO_PI);
      c.fillStyle = 'rgba(255,255,255,0.42)'; c.fill();
      balloonSprites[i] = cv;
    }
  }

  function buildSparkleSprite() {
    const SZ = 96, c0 = SZ / 2;
    sparkleSprite = newCanvas(SZ, SZ);
    const c = sparkleSprite.getContext('2d');
    // soft radial glow (baked — replaces shadowBlur)
    const g = c.createRadialGradient(c0, c0, 0, c0, c0, c0);
    g.addColorStop(0, 'rgba(170,220,255,0.85)'); g.addColorStop(0.4, 'rgba(120,180,255,0.25)'); g.addColorStop(1, 'rgba(120,180,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(c0, c0, c0, 0, TWO_PI); c.fill();
    // 4-point star
    const r = SZ * 0.42;
    c.beginPath();
    c.moveTo(c0, c0 - r); c.quadraticCurveTo(c0, c0, c0 + r, c0);
    c.quadraticCurveTo(c0, c0, c0, c0 + r); c.quadraticCurveTo(c0, c0, c0 - r, c0);
    c.quadraticCurveTo(c0, c0, c0, c0 - r); c.fillStyle = '#eaf6ff'; c.fill();
  }

  function buildHaloSprite() {
    const SZ = 160, c0 = SZ / 2;
    haloSprite = newCanvas(SZ, SZ);
    const c = haloSprite.getContext('2d');
    const g = c.createRadialGradient(c0, c0, 0, c0, c0, c0);
    g.addColorStop(0, 'rgba(255,222,130,0.6)'); g.addColorStop(0.4, 'rgba(255,150,60,0.18)'); g.addColorStop(1, 'rgba(255,150,60,0)');
    c.fillStyle = g; c.beginPath(); c.arc(c0, c0, c0, 0, TWO_PI); c.fill();
  }

  // ============================================================
  //  State machine
  // ============================================================
  const S = { IDLE: 0, INTRO: 1, LIT: 2, BLOWING: 3, FINALE: 4 };
  let state = S.IDLE, stateT = 0, customerName = 'Sarah';
  function setState(s) { state = s; stateT = 0; }

  // ============================================================
  //  Balloons
  // ============================================================
  let balloons = [];
  function spawnBalloon(initial) {
    const r = U * (0.05 + Math.random() * 0.035);
    const idx = (Math.random() * BALLOON_COLORS.length) | 0;
    balloons.push({
      x: cw * (0.06 + Math.random() * 0.88),
      y: initial ? ch * (0.2 + Math.random() * 0.95) : ch + r * 2.4,
      r, vy: U * (0.00075 + Math.random() * 0.0007),
      sway: Math.random() * TWO_PI, swaySpeed: 0.6 + Math.random() * 0.7, swayAmp: r * (0.5 + Math.random() * 0.5),
      idx, c0: BALLOON_COLORS[idx][0], tilt: (Math.random() - 0.5) * 0.25,
    });
  }
  function seedBalloons() {
    balloons = [];
    const count = cw > 900 ? 10 : 7;
    for (let i = 0; i < count; i++) spawnBalloon(true);
  }
  function updateBalloons(dt) {
    for (const b of balloons) {
      b.y -= b.vy * dt * 16.67;
      b.sway += b.swaySpeed * dt * 0.02;
      if (b.y < -b.r * 3) { b.y = ch + b.r * 2.6; b.x = cw * (0.06 + Math.random() * 0.88); }
    }
  }
  function drawBalloon(b) {
    const x = b.x + Math.sin(b.sway) * b.swayAmp;
    const y = b.y, r = b.r;
    const rot = Math.sin(b.sway) * 0.08 + b.tilt;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    // string (cheap live stroke)
    ctx.beginPath();
    ctx.moveTo(0, r * 1.04);
    ctx.quadraticCurveTo(r * 0.18, r * 1.6, -r * 0.08, r * 2.3);
    ctx.quadraticCurveTo(-r * 0.3, r * 2.9, r * 0.04, r * 3.5);
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = Math.max(1, r * 0.03);
    ctx.stroke();
    // body sprite scaled to r
    const scale = r / BR;
    ctx.scale(scale, scale);
    ctx.drawImage(balloonSprites[b.idx], -BR, -BR * 1.02);
    ctx.restore();
  }

  // ============================================================
  //  Confetti
  // ============================================================
  let confetti = [];
  const CONF_COLORS = ['#82D2FF', '#3FA7E0', '#5A6BD8', '#FFFFFF', '#FFD45E', '#74E7D9', '#FF9BCF'];
  function pushPiece(x, y, vx, vy) {
    confetti.push({
      x, y, vx, vy, rot: Math.random() * TWO_PI, vr: (Math.random() - 0.5) * 0.45,
      w: U * (0.009 + Math.random() * 0.01), h: U * (0.013 + Math.random() * 0.014),
      color: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0], life: 1,
      ribbon: Math.random() < 0.5, wobble: Math.random() * TWO_PI,
    });
  }
  function burst(x, y, amount) {
    if (prefersReduced) return;
    for (let i = 0; i < amount; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
      const sp = (U * 0.012) * (0.5 + Math.random() * 1.1);
      pushPiece(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp - U * 0.006);
    }
  }
  function sideCannons() {
    if (prefersReduced) return;
    for (let s = 0; s < 2; s++) {
      const x = s === 0 ? cw * 0.04 : cw * 0.96, y = ch * 0.92;
      for (let i = 0; i < 64; i++) {
        const base = s === 0 ? -Math.PI * 0.32 : -Math.PI * 0.68;
        const ang = base + (Math.random() - 0.5) * 0.7;
        const sp = U * (0.016 + Math.random() * 0.016);
        pushPiece(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp);
      }
    }
  }
  function updateConfetti(dt) {
    const g = U * 0.00055;
    for (const p of confetti) {
      p.vy += g * dt * 16.67; p.vx *= 0.992; p.wobble += 0.2 * dt;
      p.x += (p.vx + Math.sin(p.wobble) * U * 0.0016) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > ch + 50) p.life = 0;
    }
    if (confetti.length) confetti = confetti.filter(p => p.life > 0);
  }
  function drawConfetti() {
    for (const p of confetti) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      if (p.ribbon) { ctx.beginPath(); ctx.ellipse(0, 0, p.w * 0.5, p.h * 0.5, 0, 0, TWO_PI); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }

  // ============================================================
  //  Sparkles
  // ============================================================
  let sparkles = [];
  function seedSparkles() {
    sparkles = [];
    const n = cw > 900 ? 24 : 15;
    for (let i = 0; i < n; i++) {
      sparkles.push({ x: Math.random() * cw, y: Math.random() * ch * 0.7,
        size: U * (0.03 + Math.random() * 0.05), phase: Math.random() * TWO_PI, speed: 0.6 + Math.random() * 1.4 });
    }
  }
  function drawSparkles(dt) {
    for (const s of sparkles) {
      s.phase += s.speed * dt * 0.04;
      const tw = Math.sin(s.phase) * 0.5 + 0.5;
      if (tw < 0.06) continue;
      const d = s.size * (0.5 + tw);
      ctx.globalAlpha = tw * 0.9;
      ctx.drawImage(sparkleSprite, s.x - d / 2, s.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  // ============================================================
  //  Flames + smoke (live)
  // ============================================================
  function drawFlame(c) {
    const w = cake.candleW;
    const wickY = c.baseY - c.h;        // flame base sits ON the candle top (wick tip is hidden inside the flame)
    const flick = Math.sin(c.flick) * 0.12 + Math.sin(c.flick * 2.3) * 0.05;
    const sx = (1 + flick) * c.flame;
    const hgt = w * 3.0 * c.flame * (1 + flick * 0.4);
    const bend = Math.sin(c.flick * 1.3) * w * 0.25 * c.flame;
    const fx = c.x + bend, fy = wickY;

    // halo (sprite)
    const hs = hgt * 3.6;
    ctx.globalAlpha = c.flame * 0.9;
    ctx.drawImage(haloSprite, fx - hs / 2, fy - hgt * 0.4 - hs / 2, hs, hs);
    ctx.globalAlpha = 1;

    // outer flame
    ctx.globalAlpha = Math.min(1, c.flame + 0.1);
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.bezierCurveTo(fx - w * 0.7 * sx, fy - hgt * 0.35, fx - w * 0.45 * sx, fy - hgt * 0.85, fx, fy - hgt);
    ctx.bezierCurveTo(fx + w * 0.45 * sx, fy - hgt * 0.85, fx + w * 0.7 * sx, fy - hgt * 0.35, fx, fy);
    const og = ctx.createLinearGradient(fx, fy, fx, fy - hgt);
    og.addColorStop(0, '#FF7A1A'); og.addColorStop(0.5, '#FFB23E'); og.addColorStop(1, '#FFE89A');
    ctx.fillStyle = og; ctx.fill();
    // inner
    ctx.beginPath();
    const ih = hgt * 0.58;
    ctx.moveTo(fx, fy - hgt * 0.06);
    ctx.bezierCurveTo(fx - w * 0.32 * sx, fy - ih * 0.4, fx - w * 0.2 * sx, fy - ih * 0.85, fx, fy - ih);
    ctx.bezierCurveTo(fx + w * 0.2 * sx, fy - ih * 0.85, fx + w * 0.32 * sx, fy - ih * 0.4, fx, fy - hgt * 0.06);
    ctx.fillStyle = '#FFF6D8'; ctx.fill();
    // blue core
    ctx.beginPath();
    ctx.ellipse(fx, fy - hgt * 0.08, w * 0.28 * sx, hgt * 0.14, 0, 0, TWO_PI);
    ctx.fillStyle = 'rgba(120,180,255,0.85)'; ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ============================================================
  //  Audio (Web Audio — generated, no files)
  // ============================================================
  let actx = null, muted = false;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function note(freq, t0, dur, type, peak) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak || 0.16, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function playBirthdayTune() {            // public-domain melody, first two phrases
    if (muted) return; const a = audio(); if (!a) return;
    const G4=392.00, A4=440.00, B4=493.88, C5=523.25, D5=587.33, beat = 0.34;
    const seq = [[G4,0.75],[G4,0.25],[A4,1],[G4,1],[C5,1],[B4,2],[G4,0.75],[G4,0.25],[A4,1],[G4,1],[D5,1],[C5,2]];
    let t = a.currentTime + 0.05;
    for (const [f, b] of seq) { note(f, t, b * beat * 0.92, 'triangle', 0.15); t += b * beat; }
  }
  function poof() {
    if (muted) return; const a = audio(); if (!a) return;
    const dur = 0.25, buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.7;
    const g = a.createGain(); g.gain.value = 0.5;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }
  function tada() {
    if (muted) return; const a = audio(); if (!a) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, a.currentTime + i * 0.06, 0.7, 'triangle', 0.16));
  }

  // ============================================================
  //  Public API
  // ============================================================
  const Birthday = {
    onComplete: null,
    start(name) {
      customerName = (name && name.trim()) || 'Friend';
      buildHeadline(customerName);
      seedBalloons(); seedSparkles(); confetti = [];
      for (const c of candles) { c.lit = true; c.flame = 1; c.smoke = []; }
      hideWish(); showHint(true); audio();
      setState(S.INTRO);
      document.getElementById('head').style.opacity = '1';
      requestAnimationFrame(() => document.getElementById('head').classList.add('in'));
      animateWords(); playBirthdayTune();
      burst(cw / 2, ch * 0.42, 90);
    },
    blow() {
      if (state !== S.LIT && state !== S.INTRO) return;
      setState(S.BLOWING); showHint(false); poof();
    },
  };

  window.Birthday = Birthday;   // expose for POS integration / testing

  // ---------- Headline ----------
  function buildHeadline(name) {
    const title = document.getElementById('title');
    title.innerHTML = '';
    ['Happy', 'Birthday'].forEach(w => {
      const span = document.createElement('span'); span.className = 'word'; span.textContent = w + ' '; title.appendChild(span);
    });
    document.getElementById('name').textContent = name;
  }
  function animateWords() {
    document.querySelectorAll('#title .word').forEach((w, i) => {
      w.classList.remove('in'); void w.offsetWidth;
      w.style.animationDelay = (i * 0.12) + 's'; w.classList.add('in');
    });
  }
  function showHint(on) { document.getElementById('hint').style.opacity = on ? '1' : '0'; }
  function showWish() { document.getElementById('wish').classList.add('show'); document.getElementById('head').style.opacity = '0'; }
  function hideWish() { document.getElementById('wish').classList.remove('show'); }
  function showHeadline() { const h = document.getElementById('head'); h.style.opacity = '1'; h.classList.add('in'); }

  // ============================================================
  //  Loop
  // ============================================================
  let lastT = 0, confTimer = 0;
  function frame(now) {
    let dt = (now - (lastT || now)) / 16.67; if (dt > 3) dt = 3;
    lastT = now;
    const dtSec = dt * 16.67 / 1000;
    stateT += dtSec;

    if (state === S.INTRO && stateT > 2.2) setState(S.LIT);

    if (state === S.BLOWING) {
      const order = stateT / 0.12;
      candles.forEach((c, i) => {
        if (c.lit && i <= order) {
          c.lit = false;
          for (let k = 0; k < 6; k++)
            c.smoke.push({ x: (Math.random() - 0.5) * cake.candleW, y: 0, vy: -(0.3 + Math.random() * 0.5), vx: (Math.random() - 0.5) * 0.3, r: cake.candleW * (0.3 + Math.random() * 0.3), life: 1 });
        }
      });
      if (stateT > 0.9 && candles.every(c => !c.lit)) {
        setState(S.FINALE); showWish(); tada(); sideCannons(); burst(cw / 2, ch * 0.45, 80);
        confTimer = 0.45;
      }
    }

    if (state === S.FINALE) {                 // keep the confetti lively across the finale
      confTimer -= dtSec;
      if (confTimer <= 0 && stateT < 3.2) { burst(cw * (0.3 + Math.random() * 0.4), ch * 0.5, 26); confTimer = 0.42; }
    }

    if (state === S.FINALE && stateT > 4.0) {
      // Rest in a calm, relit state so the display stays alive and
      // re-tappable (a real POS would instead return to its own UI here).
      setState(S.LIT);
      for (const c of candles) c.lit = true;     // relight (flames ease back up)
      hideWish(); showHeadline(); showHint(true);
      if (Birthday.onComplete) Birthday.onComplete();
    }

    for (const c of candles) {
      c.flick += dt * (0.25 + Math.random() * 0.05);
      const target = c.lit ? 1 : 0;
      c.flame += (target - c.flame) * Math.min(1, dt * 0.35);
      if (c.smoke.length) {
        for (const p of c.smoke) { p.y += p.vy * dt; p.x += p.vx * dt; p.r += dt * 0.4; p.life -= dt * 0.03; }
        c.smoke = c.smoke.filter(p => p.life > 0);
      }
    }

    if (state !== S.IDLE) updateBalloons(dt);
    if (confetti.length) updateConfetti(dt);

    draw(dt);
    requestAnimationFrame(frame);
  }

  function draw(dt) {
    ctx.clearRect(0, 0, cw, ch);
    if (state === S.IDLE) return;

    drawSparkles(dt);
    for (const b of balloons) drawBalloon(b);

    // cake sprite (static), then live flames + smoke on top
    ctx.drawImage(cakeSprite, 0, 0, cw, ch);
    for (const c of candles) {
      if (c.flame > 0.02) drawFlame(c);
      if (c.smoke.length) {
        const wickY = c.baseY - c.h;
        ctx.save();
        for (const p of c.smoke) {
          ctx.globalAlpha = p.life * 0.4;
          ctx.beginPath(); ctx.arc(c.x + p.x, wickY + p.y, p.r, 0, TWO_PI);
          ctx.fillStyle = '#cfd6e8'; ctx.fill();
        }
        ctx.restore(); ctx.globalAlpha = 1;
      }
    }
    if (confetti.length) drawConfetti();
  }

  // ============================================================
  //  Events
  // ============================================================
  canvas.addEventListener('pointerdown', () => {
    if (state === S.LIT || state === S.INTRO) Birthday.blow();
    else if (state === S.IDLE) Birthday.start(document.getElementById('nameInput').value);
  });
  document.getElementById('celebrateBtn').addEventListener('click', (e) => {
    e.stopPropagation(); Birthday.start(document.getElementById('nameInput').value);
  });
  document.getElementById('nameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') Birthday.start(e.target.value);
  });
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation(); muted = !muted;
    muteBtn.textContent = muted ? '🔇 Sound off' : '🔊 Sound on';
    if (!muted) audio();
  });
  window.addEventListener('resize', resize);

  // ============================================================
  //  Boot
  // ============================================================
  resize();
  requestAnimationFrame((t) => { lastT = t; frame(t); });
  setTimeout(() => Birthday.start(document.getElementById('nameInput').value), 400);
})();
</script>
</body>
</html>
