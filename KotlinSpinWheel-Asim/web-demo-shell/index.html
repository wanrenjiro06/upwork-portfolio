<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Find the Ball — POS Customer Display Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:#3FA7E0; --blue-deep:#1E63B0; --blue-lite:#82D2FF; --indigo:#5A6BD8;
    --gold:#FFD45E; --gold-deep:#C9962B; --ink:#060912; --text:#F4F6FF; --text-dim:#9AA8CF;
    --font-head:'Fredoka',system-ui,sans-serif; --font-body:'Outfit',system-ui,sans-serif;
  }
  html,body { height:100%; overflow:hidden; background:var(--ink); color:var(--text);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased; user-select:none; -webkit-tap-highlight-color:transparent; }
  #stage { position:fixed; inset:0; background:radial-gradient(130% 100% at 50% 0%, #16224d 0%, #0c1330 44%, #060912 100%); }
  #scene { position:absolute; inset:0; display:block; }
  .orb { position:absolute; border-radius:50%; filter:blur(90px); opacity:.4; pointer-events:none; will-change:transform; }
  .orb.a { width:520px; height:520px; background:#25559e; top:-160px; left:-120px; animation:drift1 20s ease-in-out infinite; }
  .orb.b { width:460px; height:460px; background:#4a3f9c; bottom:-180px; right:-120px; animation:drift2 24s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(46px,34px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-30px)} }

  #head { position:absolute; z-index:4; top:clamp(16px,5vh,48px); left:0; right:0; text-align:center; padding:0 24px; pointer-events:none; }
  .kicker { font-weight:600; font-size:clamp(11px,1.4vw,14px); letter-spacing:.34em; text-transform:uppercase; color:var(--blue-lite); opacity:.92; }
  h1 { font-family:var(--font-head); font-weight:700; font-size:clamp(28px,5.6vw,58px); line-height:1; margin-top:8px;
    background:linear-gradient(180deg,#fff 0%,var(--blue-lite) 58%,var(--blue) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 40px rgba(130,210,255,.2); }
  .prompt { margin-top:10px; font-size:clamp(13px,1.8vw,18px); color:var(--text-dim); font-weight:500; min-height:1.4em; transition:opacity .3s ease; }

  #banner { position:absolute; z-index:5; left:50%; top:50%; transform:translate(-50%,-50%) scale(.7);
    width:min(86vw,440px); padding:22px 28px 26px; text-align:center; border-radius:24px;
    background:linear-gradient(180deg,rgba(28,40,80,.96),rgba(12,18,40,.97)); border:1px solid rgba(130,210,255,.4);
    box-shadow:0 30px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), 0 0 70px rgba(130,210,255,.16);
    opacity:0; pointer-events:none; transition:opacity .4s ease, transform .5s cubic-bezier(.2,1.3,.4,1); }
  #banner.show { opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
  #banner .tag { font-weight:600; letter-spacing:.26em; text-transform:uppercase; font-size:12px; color:var(--gold); margin-bottom:8px; }
  #banner .msg { font-family:var(--font-head); font-weight:700; font-size:clamp(24px,5.6vw,40px); line-height:1.05; margin-bottom:16px; color:#fff; }
  #banner button { font-family:var(--font-body); font-weight:700; font-size:15px; color:#07223f;
    background:linear-gradient(180deg,var(--blue-lite),var(--blue) 56%,var(--blue-deep)); border:none; border-radius:13px; padding:12px 28px; cursor:pointer;
    box-shadow:0 10px 26px rgba(63,167,224,.34), inset 0 1px 0 rgba(255,255,255,.5); transition:transform .12s ease; }
  #banner button:active { transform:scale(.96); }

  footer { position:absolute; z-index:6; left:0; right:0; bottom:clamp(12px,3vh,28px); display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; padding:0 18px; }
  .hint { display:flex; align-items:center; gap:9px; color:var(--text-dim); font-size:13.5px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  .sep { width:1px; height:16px; background:rgba(255,255,255,.14); }
  .btn { font-family:var(--font-body); font-weight:700; font-size:14px; color:#2a1d00;
    background:linear-gradient(180deg,#FFE9A8,var(--gold) 55%,var(--gold-deep)); border:none; border-radius:11px; padding:10px 26px; cursor:pointer;
    box-shadow:0 8px 22px rgba(255,201,64,.32), inset 0 1px 0 rgba(255,255,255,.55); transition:transform .12s ease; }
  .btn:active { transform:scale(.97); }
  .ghost { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:var(--text-dim); border-radius:10px; padding:8px 13px; font-size:13px; font-family:var(--font-body); cursor:pointer; transition:all .18s ease; }
  .ghost:hover { color:var(--text); border-color:rgba(130,210,255,.4); }
  @media (prefers-reduced-motion:reduce){ .orb{ animation:none; } }
</style>
</head>
<body>
  <div id="stage">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <canvas id="scene"></canvas>

    <div id="head">
      <div class="kicker">Thanks for your order</div>
      <h1>Find the Ball</h1>
      <div class="prompt" id="prompt">Watch closely…</div>
    </div>

    <div id="banner">
      <div class="tag" id="bannerTag">🎉 You found it</div>
      <div class="msg" id="bannerMsg">Free Drink</div>
      <button id="againBtn">Play Again</button>
    </div>

    <footer>
      <div class="hint"><span class="dot"></span> Pick the cup hiding the ball</div>
      <div class="sep"></div>
      <button class="btn" id="playBtn">New Round</button>
      <button class="ghost" id="muteBtn">🔊 Sound on</button>
    </footer>
  </div>

<script>
(() => {
  'use strict';
  // ============================================================
  //  Find the Ball — POS customer-display shell game
  //  Self-contained: canvas-drawn cups, ball, shuffle, confetti;
  //  procedurally-synthesized audio (no assets).
  //
  //  PERFORMANCE MODEL (mirrors the pre-rendered face): the cup and
  //  ball are pre-rendered once to offscreen canvases; each frame
  //  only blits them at computed positions + draws the cheap bits.
  //
  //  PRODUCTION HOOK (mirrors spinTo): the back office decides the
  //  outcome (odds, stock, per-customer rules). The customer always
  //  gets to pick; the reveal is set to the predetermined result:
  //      shell.newRound(shouldWin, prizeLabel)
  //      shell.onResult = (won, prize) => { ... }
  //  Demo uses a weighted random outcome.
  // ============================================================

  const TWO_PI = Math.PI*2;
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let dpr=1, cw=0, ch=0, U=0;

  const PRIZES = ['Free Drink','Free Cookie','10% Off','Free Topping','Free Upgrade','20% Off'];

  // ---- Layout ----
  let cupW=0, cupH=0, ballR=0, baseY=0, liftAmt=0;
  const slotX = [0,0,0];
  let cupSprite=null, ballSprite=null;

  function newCanvas(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h)); return c; }
  function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
    r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2); cw=window.innerWidth; ch=window.innerHeight;
    canvas.width=Math.floor(cw*dpr); canvas.height=Math.floor(ch*dpr);
    canvas.style.width=cw+'px'; canvas.style.height=ch+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
    U=Math.min(cw,ch);
    cupW=U*0.22; cupH=U*0.30; ballR=cupW*0.22; liftAmt=cupH*0.9;
    baseY=ch*0.50;
    const spacing=cupW*1.55, midX=cw/2;
    slotX[0]=midX-spacing; slotX[1]=midX; slotX[2]=midX+spacing;
    buildSprites();
    for (const c of cups) c.x = slotX[c.slot];
  }

  function buildSprites(){
    // Cup (drawn pointing down: wide rim at bottom, domed top).
    const pad=Math.ceil(U*0.03);
    cupSprite=newCanvas(cupW+pad*2, cupH+pad*2);
    let c=cupSprite.getContext('2d'); c.translate(pad,pad);
    const w=cupW, h=cupH;
    // shadow handled separately on surface; here just the cup body
    c.beginPath();
    c.moveTo(w*0.18,0);                 // top-left of dome
    c.quadraticCurveTo(w*0.5,-h*0.06,w*0.82,0);
    c.lineTo(w*0.98,h*0.92);            // flare out to rim
    c.quadraticCurveTo(w*0.5,h*1.04,w*0.02,h*0.92);
    c.closePath();
    const g=c.createLinearGradient(0,0,w,0);
    g.addColorStop(0,shade('#3FA7E0',-30)); g.addColorStop(0.5,'#3FA7E0'); g.addColorStop(1,shade('#3FA7E0',-44));
    c.fillStyle=g; c.fill();
    // vertical sheen
    c.beginPath(); c.ellipse(w*0.36,h*0.5,w*0.07,h*0.4,0,0,TWO_PI); c.fillStyle='rgba(255,255,255,0.22)'; c.fill();
    // gold rim
    c.beginPath(); c.moveTo(w*0.02,h*0.92); c.quadraticCurveTo(w*0.5,h*1.04,w*0.98,h*0.92);
    c.lineTo(w*0.98,h*0.86); c.quadraticCurveTo(w*0.5,h*0.98,w*0.02,h*0.86); c.closePath();
    const rg=c.createLinearGradient(0,0,w,0); rg.addColorStop(0,'#FFE9A8'); rg.addColorStop(0.5,'#C9962B'); rg.addColorStop(1,'#8A651A');
    c.fillStyle=rg; c.fill();
    // knob on top
    c.beginPath(); c.arc(w*0.5,-h*0.02,w*0.07,0,TWO_PI); c.fillStyle=rg; c.fill();
    cupSprite._pad=pad;

    // Ball (gold sphere)
    const bs=Math.ceil(ballR*2.4); ballSprite=newCanvas(bs,bs);
    let b=ballSprite.getContext('2d'); const bc=bs/2;
    const bg=b.createRadialGradient(bc-ballR*0.4,bc-ballR*0.45,ballR*0.15,bc,bc,ballR);
    bg.addColorStop(0,'#FFF3C8'); bg.addColorStop(0.5,'#FFD45E'); bg.addColorStop(1,'#C9962B');
    b.beginPath(); b.arc(bc,bc,ballR,0,TWO_PI); b.fillStyle=bg; b.fill();
    b.beginPath(); b.arc(bc-ballR*0.32,bc-ballR*0.36,ballR*0.22,0,TWO_PI); b.fillStyle='rgba(255,255,255,0.6)'; b.fill();
  }

  // ---- State ----
  const S={ IDLE:'idle', REVEAL:'reveal', SHUFFLE:'shuffle', PICK:'pick', LIFT:'lift', RESULT:'result' };
  let state=S.IDLE, stateT=0;
  const cups=[ {id:0,slot:0,x:0,lift:0}, {id:1,slot:1,x:0,lift:0}, {id:2,slot:2,x:0,lift:0} ];
  let ballCup=0;             // cup id currently hiding the ball
  let pickedId=-1, won=false, prize='', revealOther=-1;
  let willWin=true;          // predetermined outcome (set per round)
  let swapsLeft=0, swap=null, shuffleSpeed=1;
  let confetti=[];

  // ---- Public API ----
  let onResultCb=null;
  window.Shell = {
    newRound(shouldWin, prizeLabel){ startRound(shouldWin, prizeLabel); },
    set onResult(fn){ onResultCb=fn; }, get onResult(){ return onResultCb; },
    get state(){ return state; }
  };

  function startRound(shouldWin, prizeLabel){
    hideBanner();
    won=false; pickedId=-1; revealOther=-1;
    willWin = (shouldWin===undefined) ? (Math.random()<0.5) : !!shouldWin;
    prize = prizeLabel || PRIZES[(Math.random()*PRIZES.length)|0];
    ballCup = (Math.random()*3)|0;
    for (const c of cups){ c.slot=c.id; c.x=slotX[c.slot]; c.lift=0; }
    audio();
    setState(S.REVEAL);
    setPrompt('Watch closely…');
  }
  function setState(s){ state=s; stateT=0; }
  function setPrompt(t){ document.getElementById('prompt').textContent=t; }

  // ---- Shuffle ----
  function beginSwap(){
    // pick two distinct slots to swap
    const a=(Math.random()*3)|0; let b=(Math.random()*3)|0; if (b===a) b=(b+1)%3;
    const ca=cups.find(c=>c.slot===a), cb=cups.find(c=>c.slot===b);
    swap={ ca, cb, fromA:slotX[a], toA:slotX[b], fromB:slotX[b], toB:slotX[a], t0:performance.now(),
      dur:(prefersReduced?420:320)/shuffleSpeed, arc:(b>a?1:-1) };
    if (soundEnabled) whoosh();
  }
  function updateSwap(now){
    if (!swap) return;
    const t=Math.min((now-swap.t0)/swap.dur,1);
    const e=t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;   // easeInOut
    const arcY=-Math.sin(t*Math.PI)*cupH*0.5;
    swap.ca.x=swap.fromA+(swap.toA-swap.fromA)*e; swap.ca.lift=arcY*0.4; swap.ca._z = swap.arc>0?1:0;
    swap.cb.x=swap.fromB+(swap.toB-swap.fromB)*e; swap.cb.lift=arcY;     swap.cb._z = swap.arc>0?0:1;
    if (t>=1){
      const sa=swap.ca.slot; swap.ca.slot=swap.cb.slot; swap.cb.slot=sa;
      swap.ca.lift=0; swap.cb.lift=0; swap.ca._z=0; swap.cb._z=0;
      swap=null; swapsLeft--;
    }
  }

  // ---- Pick / reveal ----
  function pickCup(id){
    if (state!==S.PICK) return;
    pickedId=id;
    // Controlled reveal: ball is under the picked cup iff this round should win.
    if (willWin){ ballCup=id; won=true; }
    else { won=false; let other=(id+1)%3; ballCup=other; revealOther=other; }
    setState(S.LIFT);
    if (soundEnabled) lift();
    setPrompt('');
  }

  // ---- Audio ----
  let actx=null, soundEnabled=true;
  function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); return actx; }
  function tone(freq,dur,type,peak,t0){ const a=audio(); if(!a) return; const o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq; const t=t0||a.currentTime;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak||0.1,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02); }
  function whoosh(){ if(!soundEnabled) return; const a=audio(); if(!a) return;
    const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter(); o.type='sawtooth';
    o.frequency.setValueAtTime(180,a.currentTime); o.frequency.exponentialRampToValueAtTime(90,a.currentTime+0.18);
    f.type='lowpass'; f.frequency.value=600; g.gain.setValueAtTime(0.05,a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.2);
    o.connect(f); f.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+0.22); }
  function lift(){ if(soundEnabled) tone(520,0.16,'sine',0.12); }
  function winFanfare(){ if(!soundEnabled) return; const a=audio(); if(!a) return; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.5,'triangle',0.14,a.currentTime+i*0.1)); }
  function loseTone(){ if(!soundEnabled) return; const a=audio(); if(!a) return; tone(330,0.3,'triangle',0.12,a.currentTime); tone(247,0.4,'triangle',0.12,a.currentTime+0.14); }

  // ---- Confetti ----
  const CONF=['#82D2FF','#3FA7E0','#5A6BD8','#FFFFFF','#FFD45E','#22D3EE','#FF9BCF'];
  function burst(){ if(prefersReduced) return;
    for(let s=0;s<2;s++){ const x=s===0?cw*0.05:cw*0.95, y=ch*0.9;
      for(let i=0;i<60;i++){ const base=s===0?-Math.PI*0.32:-Math.PI*0.68; const ang=base+(Math.random()-0.5)*0.7, sp=U*(0.016+Math.random()*0.016);
        confetti.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,rot:Math.random()*TWO_PI,vr:(Math.random()-0.5)*0.5,
          w:U*(0.009+Math.random()*0.01),h:U*(0.014+Math.random()*0.014),color:CONF[(Math.random()*CONF.length)|0],life:1,wob:Math.random()*TWO_PI}); } } }
  function updateConfetti(dt){ const g=U*0.00055; for(const p of confetti){ p.vy+=g*dt*16.67; p.vx*=0.992; p.wob+=0.2*dt;
    p.x+=(p.vx+Math.sin(p.wob)*U*0.0016)*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; if(p.y>ch+50) p.life=0; } if(confetti.length) confetti=confetti.filter(p=>p.life>0); }

  // ---- Loop ----
  let lastT=0;
  function frame(now){
    let dt=(now-(lastT||now))/16.67; if(dt>3) dt=3; lastT=now; stateT+=dt*16.67/1000;

    if (state===S.REVEAL){
      // lift all cups to show the ball, hold, then drop
      const up = stateT<1.3;
      const tgt = up ? liftAmt : 0;
      for (const c of cups) c.lift += (tgt - c.lift)*Math.min(1,dt*0.2);
      if (stateT>2.0){ swapsLeft = prefersReduced?4:(6+(Math.random()*3|0)); shuffleSpeed=1; setState(S.SHUFFLE); setPrompt('Keep your eye on the ball!'); }
    } else if (state===S.SHUFFLE){
      if (!swap && swapsLeft>0){ shuffleSpeed=Math.min(1.8,1+(8-swapsLeft)*0.12); beginSwap(); }
      if (swap) updateSwap(now);
      for (const c of cups) if (c!==swap?.ca && c!==swap?.cb) c.x = slotX[c.slot];
      if (!swap && swapsLeft<=0){ setState(S.PICK); setPrompt('Where is the ball? Tap a cup.'); }
    } else if (state===S.PICK){
      for (const c of cups){ c.x=slotX[c.slot]; c.lift += (0-c.lift)*Math.min(1,dt*0.2); }
    } else if (state===S.LIFT){
      const picked=cups.find(c=>c.id===pickedId);
      if (picked) picked.lift += (liftAmt - picked.lift)*Math.min(1,dt*0.18);
      if (!won && stateT>0.7){ const other=cups.find(c=>c.id===revealOther); if(other) other.lift += (liftAmt-other.lift)*Math.min(1,dt*0.16); }
      if (stateT>1.1){ setState(S.RESULT);
        if (won){ burst(); winFanfare(); showBanner(true, prize); } else { loseTone(); showBanner(false, prize); }
        if (onResultCb) onResultCb(won, won?prize:null);
      }
    }

    if (confetti.length) updateConfetti(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---- Draw ----
  function draw(){
    ctx.clearRect(0,0,cw,ch);
    if (state===S.IDLE) return;
    drawSurface();
    // ball sits on the surface under its cup; visible when that cup is lifted
    const ballCupObj = cups.find(c=>c.id===ballCup);
    const ballVisible = state===S.REVEAL || (state!==S.SHUFFLE && state!==S.PICK && ballCupObj && ballCupObj.lift>ballR*0.5);
    if (ballVisible && ballCupObj){
      const bx=ballCupObj.x, by=baseY+cupH - ballR*0.9;
      ctx.drawImage(ballSprite, bx - ballSprite.width/2, by - ballSprite.height/2);
    }
    // draw cups back-to-front (by lift z during swap, else by y)
    const order=[...cups].sort((a,b)=> (a._z||0)-(b._z||0));
    for (const c of order) drawCup(c);
    if (confetti.length) drawConfetti();
  }
  function drawSurface(){
    // soft shadows under each cup position
    for (const c of cups){
      const r=cupW*0.5*(1 - Math.min(c.lift/liftAmt,1)*0.3);
      ctx.beginPath(); ctx.ellipse(c.x+cupW*0.0, baseY+cupH+U*0.01, r, U*0.018, 0, 0, TWO_PI);
      ctx.fillStyle='rgba(0,0,0,'+(0.4 - Math.min(c.lift/liftAmt,1)*0.22)+')'; ctx.fill();
    }
  }
  function drawCup(c){
    const pad=cupSprite._pad;
    ctx.drawImage(cupSprite, c.x - cupW/2 - pad, baseY - c.lift - pad);
  }
  function drawConfetti(){ for(const p of confetti){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); } }

  // ---- Banner ----
  const banner=document.getElementById('banner');
  function showBanner(win, prize){
    document.getElementById('bannerTag').textContent = win?'🎉 You found it':'😅 Not this time';
    document.getElementById('bannerMsg').textContent = win?prize:'Try again!';
    setTimeout(()=>banner.classList.add('show'), 500);
  }
  function hideBanner(){ banner.classList.remove('show'); }

  // ---- Events ----
  canvas.addEventListener('pointerdown',(e)=>{
    if (state!==S.PICK) return;
    const rect=canvas.getBoundingClientRect(); const px=e.clientX-rect.left;
    let best=-1, bd=1e9; for(const c of cups){ const d=Math.abs(px-c.x); if(d<bd){bd=d;best=c.id;} }
    if (best>=0 && bd<cupW*0.9) pickCup(best);
  });
  document.getElementById('playBtn').addEventListener('click',(e)=>{ e.stopPropagation(); if(state===S.IDLE||state===S.RESULT||state===S.PICK){ startRound(); } });
  document.getElementById('againBtn').addEventListener('click',(e)=>{ e.stopPropagation(); hideBanner(); setTimeout(()=>startRound(),160); });
  const muteBtn=document.getElementById('muteBtn');
  muteBtn.addEventListener('click',(e)=>{ e.stopPropagation(); soundEnabled=!soundEnabled; muteBtn.textContent=soundEnabled?'🔊 Sound on':'🔇 Sound off'; if(soundEnabled) audio(); });
  window.addEventListener('resize',resize);

  // ---- Boot ----
  resize();
  requestAnimationFrame((t)=>{ lastT=t; frame(t); });
  setTimeout(()=>startRound(), 500);
})();
</script>
</body>
</html>
